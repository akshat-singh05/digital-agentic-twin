# Alembic configuration.
#
# The database URL is NOT set here: migrations/env.py uses the app's engine,
# which reads DATABASE_URL (default sqlite:///./digital_twin.db).
#
#   alembic upgrade head          # apply all migrations
#   alembic revision --autogenerate -m "describe change"
#
# The app also upgrades automatically on startup (app/db_migrations.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
