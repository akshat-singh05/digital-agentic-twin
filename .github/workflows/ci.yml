name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t digital-twin .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name twin -p 8000:8000 -e SECRET_KEY=ci-only-not-a-secret digital-twin
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs twin
          exit 1
